# エムファーム用の設定ファイル（魚の仕入れ先へのお見積り依頼）
#
# 初めて「python3 run.py check --config mfarm」を実行したとき、
# このファイルが config.mfarm.toml としてコピーされます。
# 編集するのは config.mfarm.toml の方です（config.mfarm.toml は Git には保存されません）。
# 「（要記入）」の部分は必ず書き換えてください。残っていると送信できません。
#
# Mobirio 用の設定（config.toml）とは、スプレッドシート・文面・送信者・送らない会社リストが別々です。
# 送信ログもエムファームのスプレッドシートに記録されるので、1日の上限も会社ごとに数えます。

[sheet]
# MF_魚仕入れ先調査_真鯛カンパチブリ各5社_20261023（URL をそのまま貼っても大丈夫です）
spreadsheet_id = "1Lrvfo_wp9_2xSyPyBcu7QMjoijeB9HMBLAGTdKbzT7I"
# Google の認証ファイル（Mobirio と同じものを使います）
credentials_file = "credentials/client_secret.json"
# 送信対象にするタブ（1行目が見出しになっている「自動化_送信管理」タブを使います）
tabs = ["自動化_送信管理"]
# 送信履歴を記録するタブ（なければ自動で作成されます）
log_tab = "92_送信ログ"
# エムファーム用の送らない会社リスト（なければ自動で作成されます）
exclude_file = "exclude.mfarm.txt"
# Google にログインしたあとの許可情報。
# Mobirio と同じ Google アカウントでエムファームのスプレッドシートを開ける場合は、このままで大丈夫です。
# 別の Google アカウントでログインしたい場合だけ "credentials/token_mfarm.json" に変えてください。
token_file = "credentials/token.json"

[columns]
# 「自動化_送信管理」タブ1行目の見出し名
lead_id = "企業ID"
shop_name = "会社名"
email = "送信先メールアドレス"
form_url = "お問い合わせフォームURL"
prefecture = "所在地"         # --pref 鹿児島 のように絞り込むときに使います
score = "優先度"              # A → B → C の順に送ります
remarks = "備考"
# このタブにない列（空 "" のままにしておきます）
company = ""
judgement = ""
business_status = ""
list_state = ""
email_adoption = ""
approach_count = ""
last_contact = ""

[filter]
# 「備考」にこの言葉が入っている会社には送りません（配信停止の連絡が来たら備考に「配信停止」と書く）
skip_remarks_keywords = ["配信停止", "送信不可", "営業お断り"]
# 「アプローチ回数」や「最終コンタクト」が入っている会社には送らない（このタブにはないので使いません）
skip_already_contacted = false
# true: メールアドレスがない会社だけフォームで送る / false: フォームがある会社はすべてフォーム対象
form_only_when_no_email = true
# このドメインのフォームはポータルサイト等のため使いません
skip_form_domains = [
  "instagram.com", "facebook.com", "x.com", "twitter.com", "line.me", "google.com",
]
# 以下はこのタブでは使いません
allowed_judgements = []
required_list_state = ""
allowed_email_adoption = []
skip_business_status_keywords = []

# 列の値にこの言葉が入っている会社には送りません（「列の見出し」= ["言葉", ...]）
[filter.skip_when]
"送信拒否" = ["はい"]
"送信ステータス" = ["送信済", "完了", "送信不可", "対象外", "辞退", "見送り"]

[mail]
# 1日に送る上限
daily_limit = 20
# 1通ごとの待ち時間（秒）。この範囲でランダムに待ちます。
interval_seconds = [60, 120]
# エムファーム用のメール文面
template = "templates/mfarm/email.txt"

[form]
# 1日にフォームで送る上限
daily_limit = 50
# エムファーム用のフォーム文面
template = "templates/mfarm/form.txt"
# true にすると、問い合わせフォームが登録されていない会社も、Google検索でサイトを探して対象にする
search_when_no_form = false
# "chrome" にすると Mac にインストール済みの Google Chrome を使います。
browser_channel = "chrome"

[sender]
# エムファームの送信者情報。メール本文の署名・フォームへの自動入力に使います。
# 電話番号・郵便番号・住所は公開リポジトリに載せないよう、config.mfarm.toml にだけ書いてください。
company = "株式会社エムファーム"
last_name = "菊池"
first_name = "裕人"
last_name_kana = "キクチ"   # カタカナ
first_name_kana = "ヒロト"  # カタカナ
# お名前.com のメールアドレス（Mac の「メール」アプリに追加したアドレス）
email = "h-kikuchi@mfarm.net"
phone = "（要記入）"
# 郵便番号・住所は空のままでも送れます（フォームの住所欄は、そのときブラウザで入力します）
zip = ""
address = ""
url = "https://www.mfarm.net/"
