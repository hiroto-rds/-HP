# エムファーム用の設定ファイル（お米の仕入れ先へのお見積り依頼）
#
# 「cp config.rice.example.toml config.rice.toml」で config.rice.toml を作って使います。
# 使うときは python3 run.py check --config rice のように --config rice を付けます。
# 編集するのは config.rice.toml の方です（config.rice.toml は Git には保存されません）。
# 「（要記入）」の部分は必ず書き換えてください。残っていると送信できません。
#
# Mobirio 用の設定（config.toml）とは、スプレッドシート・文面・送信者・送らない会社リストが別々です。
# 送信ログもエムファームのスプレッドシートに記録されるので、1日の上限も会社ごとに数えます。

[sheet]
# 茨城県_お米卸売候補10社_20261031（URL をそのまま貼っても大丈夫です）
spreadsheet_id = "1C2naj69vjBn7ZptlxQVsnoT5Ll8J6-jnbsqKjC0PHKY"
# Google の認証ファイル（Mobirio と同じものを使います）
credentials_file = "credentials/client_secret.json"
# 送信対象にするタブ
tabs = ["業者リスト10社"]
# 見出しの行（このタブは1〜3行目がタイトルなので、4行目が見出し）
header_row = 4
# 「優先」が 1, 2, 3… と数字の小さい会社から送る
priority_ascending = true
# 送信履歴を記録するタブ（なければ自動で作成されます）
log_tab = "92_送信ログ"
# お米用の送らない会社リスト（なければ自動で作成されます）
exclude_file = "exclude.rice.txt"
# Google にログインしたあとの許可情報（Mobirio・魚と同じ Google アカウントならこのまま）
token_file = "credentials/token.json"

[columns]
# 「業者リスト10社」タブ4行目の見出し名
shop_name = "事業者名"
email = "メール"              # 「未掲載」の会社はフォーム（公式サイト）で送ります
form_url = "公式サイト"       # 問い合わせページではなくトップページが開くので、問い合わせページを開いて r を押します
prefecture = "所在地"
score = "優先"
# このタブにない列（空 "" のままにしておきます）
lead_id = ""
company = ""
remarks = ""
judgement = ""
business_status = ""
list_state = ""
email_adoption = ""
approach_count = ""
last_contact = ""

[filter]
skip_remarks_keywords = []
skip_already_contacted = false
# true: メールアドレスがない会社だけフォームで送る
form_only_when_no_email = true
# このドメインのフォームはポータルサイト等のため使いません
skip_form_domains = [
  "instagram.com", "facebook.com", "x.com", "twitter.com", "line.me", "google.com",
]
# 以下はこのタブでは使いません
allowed_judgements = []
required_list_state = ""
allowed_email_adoption = []
skip_business_status_keywords = []

# 列の値にこの言葉が入っている会社には送りません（「列の見出し」= ["言葉", ...]）
# 「連絡状況」を「連絡済」「辞退」などに書き換えると、その会社には送りません（「未連絡」は送ります）
[filter.skip_when]
"連絡状況" = ["連絡済", "送信済", "問い合わせ済", "返信", "対象外", "辞退", "見送り", "お断り", "NG"]

[mail]
# 1日に送る上限
daily_limit = 20
# 1通ごとの待ち時間（秒）。この範囲でランダムに待ちます。
interval_seconds = [60, 120]
# お米用のメール文面
template = "templates/rice/email.txt"

[form]
# 1日にフォームで送る上限
daily_limit = 50
# お米用のフォーム文面
template = "templates/rice/form.txt"
# true にすると、問い合わせフォームが登録されていない会社も、Google検索でサイトを探して対象にする
search_when_no_form = false
# "chrome" にすると Mac にインストール済みの Google Chrome を使います。
browser_channel = "chrome"

[sender]
# エムファームの送信者情報。メール本文の署名・フォームへの自動入力に使います。
# 電話番号・郵便番号・住所は公開リポジトリに載せないよう、config.rice.toml にだけ書いてください。
company = "株式会社エムファーム"
last_name = "菊池"
first_name = "裕人"
last_name_kana = "キクチ"   # カタカナ
first_name_kana = "ヒロト"  # カタカナ
# お名前.com のメールアドレス（Mac の「メール」アプリに追加したアドレス）
email = "h-kikuchi@mfarm.net"
phone = "（要記入）"
# 郵便番号・住所は空のままでも送れます（フォームの住所欄は、そのときブラウザで入力します）
zip = ""
address = ""
url = "https://www.mfarm.net/"
